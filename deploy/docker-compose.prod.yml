services:
  pinuyumayan-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../deploy/.env.production.example
    environment:
      NODE_ENV: production
    ports:
      - "8787:8787"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ../backups:/app/backups
