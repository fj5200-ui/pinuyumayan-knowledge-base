services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pinuyumayan_test
      MYSQL_USER: pinuyumayan
      MYSQL_PASSWORD: pinuyumayan
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: ../backend
    environment:
      NODE_ENV: test
      PORT: 8787
      DATABASE_URL: mysql://pinuyumayan:pinuyumayan@mysql:3306/pinuyumayan_test
      PINUYUMAYAN_MAIN_SITE_API_KEY: ci-main-site-key
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "8787:8787"
    depends_on:
      mysql:
        condition: service_healthy
